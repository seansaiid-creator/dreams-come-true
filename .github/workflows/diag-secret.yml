name: diag-secret
on: { workflow_dispatch: {} }
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect secret shape (값은 출력하지 않음)
        env:
          RAW: ${{ secrets.GA4_SA_KEY_B64 }}
        run: |
          echo "길이: ${#RAW}"
          echo "첫 글자 코드: $(printf '%s' "$RAW" | head -c1 | od -An -c | tr -d ' ')"
          echo "'{' 로 시작? $(case "$RAW" in \{*) echo yes;; *) echo no;; esac)"
          echo "'ewog' 로 시작(base64 JSON)? $(case "$RAW" in ewog*) echo yes;; *) echo no;; esac)"
          echo "개행 포함? $(printf '%s' "$RAW" | grep -c '' )줄"
          echo "base64 문자만? $(printf '%s' "$RAW" | tr -d 'A-Za-z0-9+/=\n\r ' | wc -c) 개의 비-base64 문자"
