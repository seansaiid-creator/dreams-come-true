name: weekly-email-report
on:
  schedule:
    - cron: '30 0 * * 1'    # KST 월요일 09:30
  workflow_dispatch: {}
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Restore GA4 service-account key from secret
        env:
          GA4_KEY_RAW: ${{ secrets.GA4_SA_KEY_B64 }}
        run: |
          if [ -z "$GA4_KEY_RAW" ]; then
            echo "::error::시크릿 GA4_SA_KEY_B64 가 비어 있습니다."; exit 1
          fi
          # base64로 저장됐으면 디코드, 원본 JSON이면 그대로 사용
          printf '%s' "$GA4_KEY_RAW" | tr -d '\n\r ' | base64 -d > /tmp/sa-key.json 2>/dev/null || true
          if ! python3 -c "import json;json.load(open('/tmp/sa-key.json'))" 2>/dev/null; then
            printf '%s' "$GA4_KEY_RAW" > /tmp/sa-key.json
          fi
          python3 -c "import json;d=json.load(open('/tmp/sa-key.json'));print('키 정상:',d['client_email'])"
      - name: Build weekly comparison report
        env: { GA4_KEY: /tmp/sa-key.json }
        run: node scripts/weekly-report.mjs
      - name: Send email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: seansaiid@gmail.com
          password: ${{ secrets.MAIL_APP_PASSWORD }}
          subject: "🌙 꿈해몽 행운 주간 리포트 — ${{ github.run_started_at }}"
          to: seansaiid@gmail.com
          from: 꿈해몽 행운 리포트 <seansaiid@gmail.com>
          html_body: file://report.html
