name: weekly-health
on:
  schedule:
    - cron: '0 0 * * 1'    # KST 월요일 09:00
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Run health check (실패 시 GitHub이 운영자에게 메일 발송)
        run: node scripts/health-check.mjs
      - name: Commit STATUS.md
        if: always()
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "dream-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add STATUS.md
          git commit -m "chore: 주간 헬스체크 $(TZ=Asia/Seoul date +%F)"
          git push
