name: publish-new-dreams
on:
  schedule:
    - cron: '10 19 * * 0,2,4'   # KST 월·수·금 04:10 (주 3회 상한)
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Publish one approved entry
        run: node scripts/publish-queue.mjs
      - name: Rebuild dreams-db.js (CTA 착지용 해몽 DB)
        run: python3 scripts/build-dreams-db.py
      - name: Verify — 신규 페이지가 DB·CTA에 반영됐는지
        run: node scripts/verify-publish.mjs
      - name: Commit & push if changed
        run: |
          if git diff --quiet; then echo "no change"; exit 0; fi
          git config user.name "dream-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: 신규 꿈풀이 발행 $(TZ=Asia/Seoul date +%F)"
          git push
